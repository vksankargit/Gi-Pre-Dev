{% load l10n %}
<!-- Edit Review Action Item Form -->
<form method="post" id="editReviewActionForm" data-meeting-id="{{ meeting.id|unlocalize }}">
    {% csrf_token %}
    <input type="hidden" name="action" value="edit">
    <input type="hidden" name="action_id" value="{{ action.id|unlocalize }}">

    <div class="mb-3">
        <label for="editActionDescription" class="form-label">Action Description <span class="text-danger">*</span></label>
        <textarea class="form-control" id="editActionDescription" name="action_description" rows="3" required>{{ action.action_description }}</textarea>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="editPriority" class="form-label">Priority <span class="text-danger">*</span></label>
            <select class="form-select" id="editPriority" name="priority" required>
                <option value="high" {% if action.priority == 'high' %}selected{% endif %}>High</option>
                <option value="medium" {% if action.priority == 'medium' %}selected{% endif %}>Medium</option>
                <option value="low" {% if action.priority == 'low' %}selected{% endif %}>Low</option>
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label for="editDueDate" class="form-label">Due Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="editDueDate" name="due_date" value="{{ action.due_date|date:'Y-m-d' }}" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="editAssignedToTeam" class="form-label">Assign to Team Meeting</label>
            <select class="form-select" id="editAssignedToTeam" name="assigned_to_team">
                <option value="">Select Team Meeting</option>
                {% for team in available_teams %}
                    <option value="{{ team.id|unlocalize }}" {% if action.assigned_to_team and action.assigned_to_team.id == team.id %}selected{% endif %}>{{ team.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label for="editAssignedTo" class="form-label">Assign to Member <span class="text-danger">*</span></label>
            <select class="form-select" id="editAssignedTo" name="assigned_to" required>
                <option value="">Select Member</option>
                {% for member in team_members %}
                    <option value="{{ member.id|unlocalize }}" {% if action.assigned_to.id == member.id %}selected{% endif %}>
                        {{ member.get_full_name|default:member.username }}
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="mb-3">
        <small class="text-muted">
            <i class="fas fa-info-circle me-1"></i>
            Source: <strong>{{ action.get_parameter_type_display|default:"Review Meeting" }}</strong>
            {% if action.get_parameter_name %}
                - {{ action.get_parameter_name }}
            {% endif %}
        </small>
    </div>

    <input type="hidden" name="status" value="{{ action.status }}">

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i>Update Action
        </button>
    </div>
</form>
