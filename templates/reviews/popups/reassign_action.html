{% load l10n %}
<!-- Reassign Review Action Form -->
<div class="alert alert-success mb-2">
    <small><strong>NEW TEMPLATE LOADED v2.0</strong></small>
</div>
<div class="alert alert-info mb-3">
    <h6>Current Action:</h6>
    <p class="mb-1"><strong>{{ action.action_description|truncatechars:100 }}</strong></p>
    <small class="text-muted">Currently assigned to: {{ action.assigned_to.get_full_name|default:action.assigned_to.username }}</small>
</div>

<form method="post" id="reassignReviewActionForm" data-meeting-id="{{ meeting.id|unlocalize }}" data-action-id="{{ action.id|unlocalize }}">
    {% csrf_token %}

    <div class="mb-3">
        <label for="reassignTeam" class="form-label">Select Team Meeting <span class="text-danger">*</span></label>
        <select class="form-control" id="reassignTeam" name="team" required>
            <option value="">Choose Team Meeting</option>
            {% for team in available_teams %}
            <option value="{{ team.id|unlocalize }}">{{ team.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="reassignMember" class="form-label">Assign To <span class="text-danger">*</span></label>
        <select class="form-control" id="reassignMember" name="assigned_to" required>
            <option value="">Select team first</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="reassignReason" class="form-label">Reason for Reassignment</label>
        <textarea class="form-control" id="reassignReason" name="reassignment_reason" rows="3" placeholder="Optional: Explain why this action is being reassigned"></textarea>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" disabled id="reassignBtn">
            <i class="fas fa-user-edit me-1"></i>Reassign Action
        </button>
    </div>
</form>

<script>
function loadReassignTeamMembers() {
    console.log('loadReassignTeamMembers called');
    const teamId = document.getElementById('reassignTeam').value;
    const assigneeSelect = document.getElementById('reassignMember');
    const reassignBtn = document.getElementById('reassignBtn');

    console.log('Team ID:', teamId);
    console.log('assigneeSelect:', assigneeSelect);

    if (teamId) {
        // Show loading state
        assigneeSelect.innerHTML = '<option value="">Loading...</option>';

        // Fetch team members for reassignment
        console.log('Fetching from:', `/api/team-members-reassign/${teamId}/`);
        fetch(`/api/team-members-reassign/${teamId}/`)
            .then(response => response.json())
            .then(data => {
                if (data.success && data.members && data.members.length > 0) {
                    assigneeSelect.innerHTML = '<option value="">Select Member</option>';
                    data.members.forEach(member => {
                        const option = document.createElement('option');
                        option.value = member.id;
                        option.textContent = `${member.name} (${member.email})`;
                        assigneeSelect.appendChild(option);
                    });
                } else {
                    assigneeSelect.innerHTML = '<option value="">No members available</option>';
                }
            })
            .catch(error => {
                console.error('Error loading team members:', error);
                assigneeSelect.innerHTML = '<option value="">Error loading members</option>';
            });
    } else {
        assigneeSelect.innerHTML = '<option value="">Select team first</option>';
        reassignBtn.disabled = true;
    }
}

// Execute immediately since this is loaded via AJAX
(function() {
    console.log('Script executing - attaching event listeners');
    // Attach team dropdown change event
    const teamSelect = document.getElementById('reassignTeam');
    console.log('teamSelect found:', teamSelect);
    if (teamSelect) {
        teamSelect.addEventListener('change', loadReassignTeamMembers);
        console.log('Change event listener attached to reassignTeam');
    } else {
        console.error('reassignTeam element not found!');
    }

    // Enable reassign button when assignee is selected
    const assigneeSelect = document.getElementById('reassignMember');
    if (assigneeSelect) {
        assigneeSelect.addEventListener('change', function() {
            const reassignBtn = document.getElementById('reassignBtn');
            reassignBtn.disabled = !this.value;
        });
    }

    // Form submission
    const reassignForm = document.getElementById('reassignReviewActionForm');
    if (reassignForm) {
        reassignForm.addEventListener('submit', function(e) {
            e.preventDefault();

            // Validate member selection
            const assignedTo = document.getElementById('reassignMember').value;
            if (!assignedTo) {
                alert('Please select Member');
                return;
            }

            const meetingId = this.dataset.meetingId;
            const actionId = this.dataset.actionId;
            const actionItemsUrl = `/review/${meetingId}/action-items/`;

            const formData = new FormData();
            formData.append('action', 'reassign');
            formData.append('action_id', actionId);
            formData.append('assigned_to', assignedTo);
            formData.append('assigned_to_team', document.getElementById('reassignTeam').value);
            formData.append('reassignment_reason', document.getElementById('reassignReason').value);
            formData.append('csrfmiddlewaretoken', getCsrfToken());

            fetch(actionItemsUrl, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Close modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('reassignModal'));
                    if (modal) {
                        modal.hide();
                    }

                    // Refresh commitments
                    if (typeof refreshCommitments === 'function') {
                        refreshCommitments();
                    }
                } else {
                    alert(data.error || 'Error reassigning action');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error reassigning action');
            });
        });
    }
})();

function getCsrfToken() {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
        const [name, value] = cookie.trim().split('=');
        if (name === 'csrftoken') {
            return value;
        }
    }
    return '';
}
</script>
