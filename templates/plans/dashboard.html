{% extends 'base.html' %}
{% load static %}

{% block title %}Plan - PRE System{% endblock %}

{% block extra_css %}
<style id="customStyles">
    /* Style Option 1: Modern Gradient (Default) */
    .style-1 .page-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 2rem;
        border-radius: 12px;
        margin-bottom: 2rem;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }
    .style-1 .page-header h1 {
        color: white;
        font-weight: 600;
        margin: 0;
    }
    .style-1 .main-card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .style-1 .nav-tabs {
        border-bottom: 2px solid #e9ecef;
    }
    .style-1 .nav-tabs .nav-link {
        border: none;
        color: #6c757d;
        font-weight: 500;
        padding: 1rem 1.5rem;
        transition: all 0.3s ease;
    }
    .style-1 .nav-tabs .nav-link:hover {
        color: #667eea;
        background: #f8f9fa;
    }
    .style-1 .nav-tabs .nav-link.active {
        color: #667eea;
        background: transparent;
        border-bottom: 3px solid #667eea;
    }
    .style-1 .form-label {
        font-weight: 600;
        color: #495057;
        margin-bottom: 0.5rem;
    }
    .style-1 .form-control, .style-1 .form-select {
        border-radius: 8px;
        border: 1px solid #dee2e6;
        padding: 0.625rem 0.875rem;
        transition: all 0.3s ease;
    }
    .style-1 .form-control:focus, .style-1 .form-select:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .style-1 .btn {
        border-radius: 8px;
        padding: 0.625rem 1.25rem;
        font-weight: 500;
        transition: all 0.3s ease;
        border: none;
    }
    .style-1 .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    .style-1 .btn-primary:hover {

    .style-1 .btn-success:hover {
        transform: translateY(-2px);

    .style-1 .btn-secondary {
        background: linear-gradient(135deg, #868f96 0%, #596164 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
    }
    .style-1 .btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(108, 117, 125, 0.5);

    .style-1 .btn:disabled {

{% block content %}
<div class="style-3">
    <div class="page-header">
        <h1>
            <i class="fas fa-clipboard-list me-2"></i>Plan
        </h1>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card main-card">
                <div class="card-header">
                    <ul class="nav nav-tabs card-header-tabs" id="planTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="annual-plan-tab" data-bs-toggle="tab" data-bs-target="#annual-plan" type="button" role="tab">
                                <i class="fas fa-calendar-alt me-2"></i>Upload Annual Plan
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="quarterly-plan-tab" data-bs-toggle="tab" data-bs-target="#quarterly-plan" type="button" role="tab">
                                <i class="fas fa-calendar me-2"></i>Upload Quarterly Plan
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="card-body">
                    <div class="tab-content" id="planTabContent">
                        <!-- Annual Plan Tab -->
                        <div class="tab-pane fade show active" id="annual-plan" role="tabpanel">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Team</label>
                                        <select class="form-control" id="annualTeam" required>
                                            <option value="">Select Team</option>
                                            {% for team in managed_teams %}
                                            <option value="{{ team.id }}">{{ team.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Plan Year</label>
                                        <select class="form-control" id="annualPlanYear" required>
                                            <option value="">Select Plan Year</option>
                                            {% for year in financial_years %}
                                            <option value="{{ year.id }}">{{ year.year }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Select File</label>
                                        <input type="file" class="form-control" id="annualFile" accept=".xlsx,.xls">
                                        <div class="form-text">Upload Excel file with FPI, GPI, and PPI sheets</div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mb-4">
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-success" onclick="downloadAnnualTemplate()">
                                        <i class="fas fa-download me-2"></i>Download Template
                                    </button>
                                    <button type="button" class="btn btn-secondary" onclick="viewHistory('annual')">
                                        <i class="fas fa-history me-2"></i>View History
                                    </button>
                                </div>
                                <button type="button" class="btn btn-primary" id="uploadAnnualBtn" onclick="uploadAnnualPlan()" disabled>
                                    <i class="fas fa-upload me-2"></i>Upload
                                </button>
                            </div>

                            <div id="annualUploadStatus" class="alert" style="display: none;"></div>
                        </div>

                        <!-- Quarterly Plan Tab -->
                        <div class="tab-pane fade" id="quarterly-plan" role="tabpanel">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Team</label>
                                        <select class="form-control" id="quarterlyTeam" onchange="updateQuarterlyTemplate()" required>
                                            <option value="">Select Team</option>
                                            {% for team in managed_teams %}
                                            <option value="{{ team.id }}">{{ team.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Plan Year & Quarter</label>
                                        <select class="form-control" id="quarterlyQuarter" required>
                                            <option value="">Select Quarter</option>
                                            {% for quarter in quarters %}
                                            <option value="{{ quarter.0 }}">{{ quarter.1 }}</option>
                                            {% endfor %}
                                            {% if not quarters %}
                                            <option disabled>No quarters available</option>
                                            {% endif %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Select File</label>
                                        <input type="file" class="form-control" id="quarterlyFile" accept=".xlsx,.xls">
                                        <div class="form-text">Upload Excel file with FPI, GPI-M, GPI-W, PPI sheets</div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mb-4">
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-success" id="downloadQuarterlyBtn" onclick="downloadQuarterlyTemplate()" disabled>
                                        <i class="fas fa-download me-2"></i>Download Template
                                    </button>
                                    <button type="button" class="btn btn-secondary" onclick="viewHistory('quarterly')">
                                        <i class="fas fa-history me-2"></i>View History
                                    </button>
                                </div>
                                <button type="button" class="btn btn-primary" id="uploadQuarterlyBtn" onclick="uploadQuarterlyPlan()" disabled>
                                    <i class="fas fa-upload me-2"></i>Upload
                                </button>
                            </div>

                            <div id="quarterlyUploadStatus" class="alert" style="display: none;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- View History Modal -->
<div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Upload History</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="historyContent">
                <!-- History content will be loaded here -->
            </div>
        </div>
    </div>
</div>

<script>
// Enable upload button when all required fields are filled
document.getElementById('annualFile').addEventListener('change', checkAnnualUpload);
document.getElementById('annualTeam').addEventListener('change', checkAnnualUpload);
document.getElementById('annualPlanYear').addEventListener('change', checkAnnualUpload);

function checkAnnualUpload() {
    const file = document.getElementById('annualFile').files.length > 0;
    const team = document.getElementById('annualTeam').value;
    const year = document.getElementById('annualPlanYear').value;
    document.getElementById('uploadAnnualBtn').disabled = !(file && team && year);
}

document.getElementById('quarterlyFile').addEventListener('change', checkQuarterlyUpload);
document.getElementById('quarterlyTeam').addEventListener('change', checkQuarterlyUpload);
document.getElementById('quarterlyQuarter').addEventListener('change', checkQuarterlyUpload);

function checkQuarterlyUpload() {
    const file = document.getElementById('quarterlyFile').files.length > 0;
    const team = document.getElementById('quarterlyTeam').value;
    const quarter = document.getElementById('quarterlyQuarter').value;
    document.getElementById('uploadQuarterlyBtn').disabled = !(file && team && quarter);
}

function updateQuarterlyTemplate() {
    const team = document.getElementById('quarterlyTeam').value;
    document.getElementById('downloadQuarterlyBtn').disabled = !team;
}

function downloadAnnualTemplate() {
    window.location.href = '{% url "plans:annual_template" %}';
}

function downloadQuarterlyTemplate() {
    const teamId = document.getElementById('quarterlyTeam').value;
    if (teamId) {
        window.location.href = `/plans/quarterly/download-template/?team_id=${teamId}`;
    }
}

function uploadAnnualPlan() {
    const formData = new FormData();
    const fileInput = document.getElementById('annualFile');
    const teamId = document.getElementById('annualTeam').value;
    const yearId = document.getElementById('annualPlanYear').value;

    formData.append('file', fileInput.files[0]);
    formData.append('team_id', teamId);
    formData.append('financial_year_id', yearId);

    const statusDiv = document.getElementById('annualUploadStatus');
    statusDiv.style.display = 'block';
    statusDiv.className = 'alert alert-info';
    statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Uploading and processing...';

    fetch('{% url "plans:annual_upload" %}', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            statusDiv.className = 'alert alert-success';
            statusDiv.innerHTML = '<i class="fas fa-check-circle me-2"></i>' + data.message;
            fileInput.value = '';
            document.getElementById('uploadAnnualBtn').disabled = true;
        } else {
            statusDiv.className = 'alert alert-danger';
            statusDiv.innerHTML = '<i class="fas fa-exclamation-circle me-2"></i>' + data.error;
        }
    })
    .catch(error => {
        statusDiv.className = 'alert alert-danger';
        statusDiv.innerHTML = '<i class="fas fa-exclamation-circle me-2"></i>Upload failed: ' + error;
    });
}

function uploadQuarterlyPlan(confirmDelete = false) {
    const formData = new FormData();
    const fileInput = document.getElementById('quarterlyFile');
    const teamId = document.getElementById('quarterlyTeam').value;
    const quarterId = document.getElementById('quarterlyQuarter').value;

    formData.append('file', fileInput.files[0]);
    formData.append('team_id', teamId);
    formData.append('quarter_id', quarterId);

    if (confirmDelete) {
        formData.append('confirm_delete', 'true');
    }

    const statusDiv = document.getElementById('quarterlyUploadStatus');
    statusDiv.style.display = 'block';
    statusDiv.className = 'alert alert-info';
    statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Uploading and processing...';

    fetch('{% url "plans:quarterly_upload" %}', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            statusDiv.className = 'alert alert-success';
            statusDiv.innerHTML = '<i class="fas fa-check-circle me-2"></i>' + data.message;
            fileInput.value = '';
            document.getElementById('uploadQuarterlyBtn').disabled = true;
        } else if (data.requires_confirmation) {
            // Show confirmation dialog
            statusDiv.className = 'alert alert-warning';
            statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i>' + data.error +
                '<div class="mt-3">' +
                '<button class="btn btn-danger me-2" onclick="uploadQuarterlyPlan(true)">Yes, Delete and Upload</button>' +
                '<button class="btn btn-secondary" onclick="document.getElementById(\'quarterlyUploadStatus\').style.display=\'none\'">Cancel</button>' +
                '</div>';
        } else {
            statusDiv.className = 'alert alert-danger';
            statusDiv.innerHTML = '<i class="fas fa-exclamation-circle me-2"></i>' + data.error;
        }
    })
    .catch(error => {
        statusDiv.className = 'alert alert-danger';
        statusDiv.innerHTML = '<i class="fas fa-exclamation-circle me-2"></i>Upload failed: ' + error;
    });
}

function viewHistory(type) {
    // Navigate to the full page instead of showing in modal
    const url = type === 'annual' ? '{% url "plans:annual_history" %}' : '{% url "plans:quarterly_history" %}';
    window.location.href = url;
}
</script>
