{% extends 'base.html' %}

{% block title %}Login As - PRE System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="fas fa-user-cog me-2"></i>Login As User
                </h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    Select an organization and user to login as. All actions will be audited under your name.
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Organization</label>
                                <select class="form-control" name="organization" id="organizationSelect" required>
                                    <option value="">Select Organization</option>
                                    {% for org in organizations %}
                                    <option value="{{ org.id }}">{{ org.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">User</label>
                                <select class="form-control" name="user" id="userSelect" required disabled>
                                    <option value="">First select an organization</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="loginAsBtn" disabled>
                            <i class="fas fa-sign-in-alt me-2"></i>Login As
                        </button>
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('organizationSelect').addEventListener('change', function() {
    const organizationId = this.value;
    const userSelect = document.getElementById('userSelect');
    const loginBtn = document.getElementById('loginAsBtn');

    if (organizationId) {
        // Fetch users for selected organization
        fetch(`/organizations/ajax/get-users/${organizationId}/`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
            }
        })
        .then(response => response.json())
        .then(data => {
            userSelect.innerHTML = '<option value="">Select User</option>';
            if (data.success && data.users.length > 0) {
                data.users.forEach(user => {
                    userSelect.innerHTML += `<option value="${user.id}">${user.name} (${user.email})</option>`;
                });
                userSelect.disabled = false;
            } else {
                userSelect.innerHTML = '<option value="">No users available</option>';
                userSelect.disabled = true;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            userSelect.innerHTML = '<option value="">Error loading users</option>';
            userSelect.disabled = true;
        });
    } else {
        userSelect.innerHTML = '<option value="">First select an organization</option>';
        userSelect.disabled = true;
        loginBtn.disabled = true;
    }
});

document.getElementById('userSelect').addEventListener('change', function() {
    const userId = this.value;
    const loginBtn = document.getElementById('loginAsBtn');
    loginBtn.disabled = !userId;
});
</script>
{% endblock %}
